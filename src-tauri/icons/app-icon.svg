<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <!-- Rounded-square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <!-- Microphone, white -->
  <g stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" fill="none">
    <!-- capsule (mic head) -->
    <rect x="412" y="255" width="200" height="300" rx="100" ry="100" fill="#FFFFFF" stroke="none"/>
    <!-- cradle: lower semicircle wrapping the head -->
    <path d="M687 440 A175 175 0 0 1 337 440"/>
    <!-- stem -->
    <path d="M512 615 L512 735"/>
    <!-- base -->
    <path d="M412 755 L612 755"/>
  </g>
</svg>
